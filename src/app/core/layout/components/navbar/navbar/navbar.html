<nav id="desktop-navigation">
  <a class="company-logo" routerLink="/" aria-label="UrbanCore home">
    <img src="/icons/logo.svg" alt="UrbanCore Logo">
    <p>URBAN CORE</p>
  </a>

  <ul class="desktop-menu">
    @for (link of links(); track $index) {
      <app-nav-link
        [link]="link"
      />
    }
  </ul>

  <div class="desktop-login-buttons">
    @if(isUserLogged()){
      <app-nav-user-avatar/>
    }@else {
      <button class="login-button" (click)="onSignInWithGoogle()" [disabled]="isSigningIn()" [attr.aria-busy]="isSigningIn()">
        @if (isSigningIn()) {
          <i class="fa-solid fa-spinner loading-icon" aria-hidden="true"></i>
        } @else {
          <img src="icons/google-icon.svg" alt="Google Icon">
        }
        <span>{{ isSigningIn() ? 'Signing in...' : 'Sign in' }}</span>
      </button>
    }
  </div>

  <button
    #openMenuButton
    (click)="onOpenMenuClick()"
    id="open-menu-button"
    aria-controls="mobile-navigation"
    aria-label="Open menu"
    [attr.aria-expanded]="isMenuOpen()"
    [class.hidden]="isMenuOpen()"

    >
      <i class="menu-icon fa-solid fa-bars" aria-hidden="true"></i>
  </button>
</nav>
<nav
  #mobileNavigation
  id="mobile-navigation"
  aria-label="Mobile Navigation"
  [class.visible]="isMenuOpen()"
  [attr.aria-hidden]="!isMenuOpen()"
  [attr.inert]="isMenuOpen() ? null : ''"
>
  <header>
    <a class="company-logo" routerLink="/" aria-label="UrbanCore home" (click)="onCloseMenuClick()">
      <img src="/icons/logo.svg" alt="UrbanCore Logo">
      <p>URBAN CORE</p>
    </a>
    <button
        #closeMenuButton
        (click)="onCloseMenuClick()"
        id="close-menu-button"
        aria-controls="mobile-navigation"
        aria-label="Close menu"
        [attr.aria-expanded]="isMenuOpen()"
      >
        <i class="menu-icon fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </header>
  @if (isUserLogged()) {
    <app-nav-user-avatar/>
  }
  <ul>
    @for (link of links(); track $index) {
      <app-nav-link
        [link]="link"
        (clicked)="onCloseMenuClick()"
      />
    }
  </ul>
  <footer>
    @if(isUserLogged()){
      <button class="logout-button" (click)="onSignOut()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Log Out</span>
      </button>
    }@else {
      <button class="login-button" (click)="onSignInWithGoogle()" [disabled]="isSigningIn()" [attr.aria-busy]="isSigningIn()">
        @if (isSigningIn()) {
          <i class="fa-solid fa-spinner loading-icon" aria-hidden="true"></i>
        } @else {
          <img src="icons/google-icon.svg" alt="Google Icon">
        }
        <span>{{ isSigningIn() ? 'Signing in...' : 'Sign in with Google' }}</span>
      </button>
    }
  </footer>
</nav>
