<div class="user-card">
  <button
    #avatarButton
    class="avatar-button"
    type="button"
    (click)="toggleDesktopMenu($event)"
    [attr.aria-expanded]="isDesktopMenuOpen"
    aria-controls="avatar-desktop-menu"
    [attr.aria-label]="isDesktopMenuOpen ? 'Close user menu' : 'Open user menu'"
  >
    <img [src]="imgUrl()" width="40" height="40" loading="lazy" decoding="async" alt="User Avatar" referrerpolicy="no-referrer">
  </button>
  <div class="user-card__info">
    <div class="user_details">
      <p class="name">{{name()}}</p>
      <p>{{ role() | userRoleLabel }}</p>
    </div>
    <p class="active_session"><i class="fa-solid fa-circle-dot" aria-hidden="true"></i> Active Session</p>
  </div>
</div>
@if (isDesktopMenuOpen) {
  <section class="avatar-desktop-menu" id="avatar-desktop-menu" aria-label="User menu">
    <div class="avatar-desktop-menu__user">
      <div class="user_details">
        <p class="name">{{name()}}</p>
        <p>{{ role() | userRoleLabel }}</p>
      </div>
      <p class="active_session"><i class="fa-solid fa-circle-dot" aria-hidden="true"></i> Active Session</p>
    </div>
    <button type="button" id="logout-button" (click)="onSignOut()">
      <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
      <span>Log Out</span>
    </button>
  </section>
}
