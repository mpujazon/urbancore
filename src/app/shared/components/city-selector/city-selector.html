@if (isOpen()) {
  <button
    type="button"
    class="city-selector-backdrop"
    aria-label="Close city selector"
    (click)="close(true)"
  ></button>
}

<section class="city-selector" aria-label="City selector">
  @if (isOpen()) {
    <div class="city-selector-panel" id="city-selector-panel">
      <label class="city-selector-label" for="city-selector-search">Search city</label>
      <input
        id="city-selector-search"
        #citySearch
        class="city-selector-search"
        type="search"
        autocomplete="off"
        [value]="query()"
        (input)="updateQuery($event)"
        placeholder="Type a city"
      />

      <div class="city-selector-results" role="group" aria-label="Available cities">
        @if (showGlobalOption()) {
          <button
            type="button"
            class="city-selector-option city-selector-option-global"
            [class.selected]="!selectedCity()"
            (click)="selectGlobalCity()"
          >
            Worldwide
          </button>
        }

        @for (city of filteredCities(); track city.id) {
          <button
            type="button"
            class="city-selector-option"
            [class.selected]="selectedCity()?.id === city.id"
            (click)="selectCity(city)"
          >
            {{ city.name }}
          </button>
        }

        @if (hasNoResults()) {
          <p class="city-selector-empty">No cities match that name.</p>
        }
      </div>
    </div>
  }

  <button
    #citySelectorTrigger
    type="button"
    class="city-selector-trigger"
    aria-controls="city-selector-panel"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <span class="city-selector-pin" aria-hidden="true">⌖</span>
    <span class="city-selector-name">{{ selectedCity()?.name ?? 'Worldwide' }}</span>
  </button>
</section>
