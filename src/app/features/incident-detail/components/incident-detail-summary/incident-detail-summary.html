<section class="incident-detail-summary" aria-labelledby="incident-summary-title">
  <h2 id="incident-summary-title">Public summary</h2>

  <dl class="incident-detail-summary__grid">
    <div class="incident-detail-summary__item">
      <dt>Reported</dt>
      <dd>{{ summary().createdAtLabel }}</dd>
    </div>

    <div class="incident-detail-summary__item">
      <dt>Status</dt>
      <dd>
        <app-status-pill
          class="status-pill--inline status-pill--compact"
          [statusName]="summary().statusLabel"
          [classStyle]="summary().statusTone"
        />
      </dd>
    </div>

    <div class="incident-detail-summary__item">
      <dt>Category</dt>
      <dd>{{ summary().categoryLabel }}</dd>
    </div>


    <div class="incident-detail-summary__item">
      <dt>Priority</dt>
      @if (summary().priorityLabel) {
        <dd>{{ summary().priorityLabel }}</dd>
      }@else{
        <dd>To be assigned</dd>
      }
    </div>

    @if (summary().updatedAtLabel) {
      <div class="incident-detail-summary__item incident-detail-summary__item--update-date">
        <dt>Updated</dt>
        <dd>{{ summary().updatedAtLabel }}</dd>
      </div>
    }
  </dl>
</section>
