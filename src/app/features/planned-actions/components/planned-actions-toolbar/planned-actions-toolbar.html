<section class="planned-actions-toolbar" aria-label="Planned actions calendar controls">
  <div class="range-controls" role="group" aria-label="Date range controls">
    <button type="button" (click)="previousRange.emit()" aria-label="Show previous date range">
      <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="today-button" (click)="currentRange.emit()">
      Today
    </button>
    <button type="button" (click)="nextRange.emit()" aria-label="Show next date range">
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <p class="range-label" aria-live="polite">{{ rangeLabel() }}</p>

  <div class="view-toggle" role="group" aria-label="Calendar view mode">
    @for (mode of viewModes; track mode.value) {
      <button
        type="button"
        [class.active]="viewMode() === mode.value"
        [attr.aria-pressed]="viewMode() === mode.value"
        (click)="onViewModeChange(mode.value)"
      >
        {{ mode.label }}
      </button>
    }
  </div>

  @if (isLoading()) {
    <span class="refreshing" aria-live="polite">Refreshing schedule</span>
  }
</section>
