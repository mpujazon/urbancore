<article
  id="report-incident-form"
  class="panel"
  [class.panel--ai-loading]="isAutocompleteLoading()"
  [attr.aria-busy]="isAutocompleteLoading()"
>
  <div class="section-title">
    <i class="icon fa-regular fa-file-lines"></i>
    <h2>Incident Details</h2>
  </div>

  @if (isAutocompleteLoading()) {
    <div class="ai-loading-card" role="status" aria-live="polite">
      <span class="ai-loading-orb" aria-hidden="true">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </span>
      <span>
        <strong>AI is drafting your incident details</strong>
        <span>Reading the first image and preparing title, description, and category suggestions.</span>
      </span>
    </div>
  }

  <form class="field-stack" [formGroup]="incidentForm">
    <label class="field">
      <span>Incident Title</span>
      @if (isAutocompleteLoading()) {
        <span class="field-loading-note">Generating title</span>
      }
      <input type="text" formControlName="title" placeholder="e.g. Broken streetlight on 5th Ave" required />
      @if (hasControlError('title')) {
        <span class="field-error">{{ getControlError('title') }}</span>
      }
    </label>
    <label class="field">
      <span>Detailed Description</span>
      @if (isAutocompleteLoading()) {
        <span class="field-loading-note">Building description</span>
      }
      <textarea
        formControlName="description"
        rows="5"
        placeholder="Describe the situation in detail. Include any identifying markers or specific hazards..."
      ></textarea>
      @if (hasControlError('description')) {
        <span class="field-error">{{ getControlError('description') }}</span>
      }
    </label>
    <label class="field">
      <span>Category</span>
      @if (isAutocompleteLoading()) {
        <span class="field-loading-note">Choosing category</span>
      }
      <select formControlName="category" aria-label="Category">
        @for (category of incidentCategories; track category) {
          <option [value]="category">{{ category | incidentCategoryLabel }}</option>
        }
      </select>
      @if (hasControlError('category')) {
        <span class="field-error">{{ getControlError('category') }}</span>
      }
    </label>
  </form>
</article>
